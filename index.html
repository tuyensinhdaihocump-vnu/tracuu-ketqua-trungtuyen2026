<!DOCTYPE html>
<html lang="vi">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Tra cứu kết quả trúng tuyển 2026
  </title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f3f6fa;

      color: #1f2937;

      min-height: 100vh;

      -webkit-font-smoothing:
        antialiased;
    }


    /* =========================================
       CONTAINER
       ========================================= */

    .container {

      width: 100%;

      max-width: 760px;

      margin: 0 auto;

      padding:
        24px 18px 50px;
    }


    /* =========================================
       HEADER
       ========================================= */

    .header {

      text-align: center;

      margin-bottom: 22px;
    }


    .logo {

      display: block;

      width: auto;

      height: 82px;

      max-width: 150px;

      object-fit: contain;

      margin:
        0 auto 8px;
    }


    .title {

      margin: 0;

      color: #00843d;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 28px;

      font-weight: 800;

      font-style: normal;

      line-height: 1.15;

      letter-spacing: 0.2px;

      text-transform: uppercase;
    }


    .subtitle {

      margin-top: 10px;

      color: #718096;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 15px;

      font-weight: 400;

      line-height: 1.4;
    }


    /* =========================================
       SEARCH CARD
       ========================================= */

    .search-card {

      background: #ffffff;

      border-radius: 18px;

      padding: 26px;

      box-shadow:
        0 8px 25px
        rgba(0, 0, 0, 0.06);

      margin-bottom: 20px;
    }


    .label {

      display: block;

      margin-bottom: 9px;

      color: #374151;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 15px;

      font-weight: 700;
    }


    .input {

      width: 100%;

      height: 50px;

      padding:
        0 15px;

      border:
        1px solid #d8dee8;

      border-radius: 12px;

      background: #ffffff;

      color: #111827;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 16px;

      outline: none;

      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }


    .input::placeholder {

      color: #9ca3af;

      opacity: 1;
    }


    .input:focus {

      border-color: #00843d;

      box-shadow:
        0 0 0 3px
        rgba(0, 132, 61, 0.10);
    }


    /* =========================================
       BUTTON
       ========================================= */

    .button {

      width: 100%;

      height: 50px;

      margin-top: 14px;

      border: none;

      border-radius: 11px;

      background: #00843d;

      color: #ffffff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 15px;

      font-weight: 700;

      cursor: pointer;

      transition:
        background 0.2s;
    }


    .button:hover {

      background: #006f34;
    }


    .button:disabled {

      background: #9bbdaa;

      cursor: not-allowed;
    }


    /* =========================================
       NOTE
       ========================================= */

    .note {

      margin-top: 11px;

      color: #8a94a6;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 13px;

      font-weight: 400;

      text-align: center;
    }


    /* =========================================
       LOADING
       ========================================= */

    .loading {

      display: none;

      margin-top: 12px;

      color: #00843d;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 14px;

      font-weight: 600;

      text-align: center;
    }


    /* =========================================
       ERROR
       ========================================= */

    .error {

      display: none;

      margin-top: 14px;

      padding:
        12px 15px;

      border-radius: 10px;

      background: #fff1f2;

      color: #be123c;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 14px;

      font-weight: 500;

      line-height: 1.4;

      text-align: center;
    }


    /* =========================================
       RESULT CARD
       ========================================= */

    .result-card {

      display: none;

      background: #ffffff;

      border-radius: 18px;

      border-top:
        4px solid #00843d;

      padding:
        28px 24px;

      box-shadow:
        0 8px 25px
        rgba(0, 0, 0, 0.06);
    }


    /* =========================================
       SUCCESS ICON
       ========================================= */

    .success-icon {

      width: 52px;

      height: 52px;

      margin:
        0 auto 10px;

      border-radius: 50%;

      background: #dcfce7;

      color: #00843d;

      display: flex;

      align-items: center;

      justify-content: center;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 30px;

      font-weight: 700;
    }


    /* =========================================
       SUCCESS TITLE
       ========================================= */

    .success-title {

      margin: 0;

      color: #00843d;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 24px;

      font-weight: 800;

      text-align: center;
    }


    .success-subtitle {

      margin-top: 7px;

      margin-bottom: 22px;

      color: #718096;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 14px;

      font-weight: 400;

      text-align: center;
    }


    /* =========================================
       INFORMATION
       ========================================= */

    .info-row {

      display: grid;

      grid-template-columns:
        180px
        minmax(0, 1fr);

      min-height: 49px;

      border-top:
        1px solid #e5e7eb;

      align-items: center;

      column-gap: 10px;
    }


    .info-label {

      color: #718096;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 14px;

      font-weight: 500;

      line-height: 1.4;
    }


    .info-value {

      min-width: 0;

      color: #111827;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 15px;

      font-weight: 700;

      line-height: 1.4;

      word-break: break-word;
    }


    /* =========================================
       STATUS
       ========================================= */

    .status {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      padding:
        7px 13px;

      border-radius: 20px;

      background: #dcfce7;

      color: #087f3b;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 13px;

      font-weight: 700;

      line-height: 1;
    }


    /* =========================================
       MOBILE
       ========================================= */

    @media (max-width: 600px) {

      .container {

        padding:
          20px 12px 40px;
      }


      .logo {

        height: 70px;
      }


      .title {

        font-size: 23px;
      }


      .subtitle {

        font-size: 14px;
      }


      .search-card {

        padding:
          20px 16px;
      }


      .result-card {

        padding:
          23px 16px;
      }


      .info-row {

        grid-template-columns:
          135px
          minmax(0, 1fr);
      }


      .info-label {

        font-size: 13px;
      }


      .info-value {

        font-size: 14px;
      }


      .success-title {

        font-size: 22px;
      }

    }

  </style>

</head>


<body>


  <div class="container">


    <!-- =========================================
         HEADER
         ========================================= -->

    <div class="header">


      <img
        class="logo"
        src="https://tuyensinhdaihocump-vnu.github.io/tracuutrangthaihoso2026/logo.png"
        alt="Logo UMP"
        onerror="this.style.display='none'"
      >


      <h1 class="title">
        TRA CỨU KẾT QUẢ<br>
        TRÚNG TUYỂN
      </h1>


      <div class="subtitle">
        Nhập số CCCD để tra cứu kết quả trúng tuyển.
      </div>


    </div>



    <!-- =========================================
         SEARCH
         ========================================= -->

    <div class="search-card">


      <label
        for="cccd"
        class="label"
      >
        Số CCCD
      </label>


      <input
        id="cccd"
        class="input"
        type="text"
        inputmode="numeric"
        maxlength="12"
        placeholder="Nhập 12 số CCCD"
        autocomplete="off"
      >


      <button
        id="searchBtn"
        class="button"
        type="button"
        onclick="searchStudent()"
      >
        TRA CỨU KẾT QUẢ
      </button>


      <div
        id="loading"
        class="loading"
      >
        Đang tra cứu...
      </div>


      <div class="note">
        Vui lòng nhập đúng 12 số CCCD.
      </div>


      <div
        id="error"
        class="error"
      ></div>


    </div>



    <!-- =========================================
         RESULT
         ========================================= -->

    <div
      id="resultCard"
      class="result-card"
    >


      <div class="success-icon">
        ✓
      </div>


      <h2 class="success-title">
        CHÚC MỪNG!
      </h2>


      <div class="success-subtitle">
        Thí sinh đã trúng tuyển.
      </div>



      <!-- HỌ TÊN -->

      <div class="info-row">

        <div class="info-label">
          Họ và tên
        </div>

        <div
          id="studentName"
          class="info-value"
        ></div>

      </div>



      <!-- SỐ BÁO DANH -->

      <div class="info-row">

        <div class="info-label">
          Số báo danh
        </div>

        <div
          id="studentSBD"
          class="info-value"
        ></div>

      </div>



      <!-- NGÀY SINH -->

      <div class="info-row">

        <div class="info-label">
          Ngày sinh
        </div>

        <div
          id="studentDOB"
          class="info-value"
        ></div>

      </div>



      <!-- NGÀNH -->

      <div class="info-row">

        <div class="info-label">
          Ngành trúng tuyển
        </div>

        <div
          id="studentMajor"
          class="info-value"
        ></div>

      </div>



      <!-- NGUYỆN VỌNG -->

      <div class="info-row">

        <div class="info-label">
          Nguyện vọng trúng tuyển
        </div>

        <div
          id="studentNV"
          class="info-value"
        ></div>

      </div>



      <!-- TRẠNG THÁI -->

      <div class="info-row">

        <div class="info-label">
          Trạng thái
        </div>

        <div>

          <span
            id="studentStatus"
            class="status"
          ></span>

        </div>

      </div>


    </div>


  </div>


  <!-- =========================================
       JAVASCRIPT
       ========================================= -->

  <script>

    /*
     * =================================================
     * QUAN TRỌNG:
     * THAY URL DƯỚI ĐÂY BẰNG URL WEB APP APPS SCRIPT
     * CỦA BẠN.
     *
     * Ví dụ:
     * https://script.google.com/macros/s/XXXXXXXX/exec
     * =================================================
     */

    const API_URL =
      "DÁN_URL_WEB_APP_GOOGLE_APPS_SCRIPT_CỦA_BẠN_VÀO_ĐÂY";


    /*
     * ================================================
     * TRA CỨU
     * ================================================
     */

    async function searchStudent() {

      const input =
        document.getElementById("cccd");

      const button =
        document.getElementById("searchBtn");

      const loading =
        document.getElementById("loading");

      const error =
        document.getElementById("error");

      const resultCard =
        document.getElementById("resultCard");


      const cccd =
        input.value.trim();


      /*
       * RESET
       */

      resultCard.style.display =
        "none";

      error.style.display =
        "none";


      /*
       * KIỂM TRA CCCD
       */

      if (!/^\d{12}$/.test(cccd)) {

        showError(
          "Vui lòng nhập đúng 12 số CCCD."
        );

        return;
      }


      /*
       * LOADING
       */

      button.disabled =
        true;

      loading.style.display =
        "block";


      try {


        /*
         * TẠO URL
         */

        const url =
          API_URL +
          "?cccd=" +
          encodeURIComponent(cccd);


        /*
         * GỌI APPS SCRIPT
         */

        const response =
          await fetch(url);


        /*
         * KIỂM TRA RESPONSE
         */

        if (!response.ok) {

          throw new Error(
            "Không thể kết nối máy chủ."
          );

        }


        /*
         * ĐỌC JSON
         */

        const resultData =
          await response.json();


        console.log(
          "Kết quả:",
          resultData
        );


        /*
         * KHÔNG TÌM THẤY
         */

        if (
          !resultData.success
        ) {

          showError(
            resultData.message ||
            "Không tìm thấy thông tin thí sinh."
          );

          return;
        }


        /*
         * LẤY DATA
         */

        const data =
          resultData.data;


        /*
         * HỌ TÊN
         */

        document.getElementById(
          "studentName"
        ).textContent =
          data.hoTen || "";


        /*
         * SỐ BÁO DANH
         */

        document.getElementById(
          "studentSBD"
        ).textContent =
          data.sbd || "";


        /*
         * NGÀY SINH
         */

        document.getElementById(
          "studentDOB"
        ).textContent =
          data.ngaySinh || "";


        /*
         * NGÀNH TRÚNG TUYỂN
         */

        document.getElementById(
          "studentMajor"
        ).textContent =
          data.nganh || "";


        /*
         * NGUYỆN VỌNG
         */

        document.getElementById(
          "studentNV"
        ).textContent =
          data.nv || "";


        /*
         * TRẠNG THÁI
         */

        document.getElementById(
          "studentStatus"
        ).textContent =
          data.trangThai ||
          "TRÚNG TUYỂN";


        /*
         * HIỂN THỊ KẾT QUẢ
         */

        resultCard.style.display =
          "block";


        /*
         * CUỘN XUỐNG
         */

        setTimeout(
          function () {

            resultCard.scrollIntoView({
              behavior: "smooth",
              block: "start"
            });

          },
          100
        );


      }


      catch (errorObject) {

        console.error(
          errorObject
        );


        showError(
          "Có lỗi xảy ra khi tra cứu. Vui lòng thử lại."
        );

      }


      finally {

        button.disabled =
          false;

        loading.style.display =
          "none";

      }

    }


    /*
     * ================================================
     * HIỂN THỊ LỖI
     * ================================================
     */

    function showError(message) {

      const error =
        document.getElementById("error");


      error.textContent =
        message;


      error.style.display =
        "block";

    }


    /*
     * ================================================
     * CHỈ CHO NHẬP SỐ
     * ================================================
     */

    document
      .getElementById("cccd")
      .addEventListener(
        "input",
        function () {

          this.value =
            this.value
              .replace(/\D/g, "")
              .slice(0, 12);

        }
      );


    /*
     * ================================================
     * NHẤN ENTER
     * ================================================
     */

    document
      .getElementById("cccd")
      .addEventListener(
        "keydown",
        function (event) {

          if (
            event.key === "Enter"
          ) {

            searchStudent();

          }

        }
      );

  </script>


</body>

</html>

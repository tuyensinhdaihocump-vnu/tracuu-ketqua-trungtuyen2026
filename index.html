<!DOCTYPE html>
<html lang="vi">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Tra cứu kết quả trúng tuyển 2026"
  >

  <title>Tra cứu kết quả trúng tuyển 2026</title>


  <!-- =====================================================
       CSS
       ===================================================== -->

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- =====================================================
       MAIN CONTAINER
       ===================================================== -->

  <div class="page-container">


    <!-- ===================================================
         HEADER
         =================================================== -->

    <header class="page-header">


      <!-- LOGO UMP -->

      <img
        class="ump-logo"
        src="https://tuyensinhdaihocump-vnu.github.io/tracuutrangthaihoso2026/logo.png"
        alt="Logo UMP"
        onerror="this.style.display='none'"
      >


      <!-- =================================================
           TIÊU ĐỀ
           ================================================= -->

      <div class="main-heading">

        TRA CỨU KẾT QUẢ<br>

        TRÚNG TUYỂN

      </div>


      <!-- =================================================
           MÔ TẢ
           ================================================= -->

      <div class="page-subtitle">

        Nhập số CCCD để tra cứu kết quả trúng tuyển.

      </div>


    </header>



    <!-- ===================================================
         SEARCH CARD
         =================================================== -->

    <section class="search-card">


      <!-- LABEL -->

      <label
        for="cccd"
        class="cccd-label"
      >

        Số CCCD

      </label>


      <!-- =================================================
           CCCD INPUT
           ================================================= -->

      <input
        id="cccd"
        class="cccd-input"
        type="text"
        inputmode="numeric"
        maxlength="12"
        placeholder="Nhập 12 số CCCD"
        autocomplete="off"
      >


      <!-- =================================================
           SEARCH BUTTON
           ================================================= -->

      <button
        id="searchBtn"
        class="search-button"
        type="button"
      >

        TRA CỨU KẾT QUẢ

      </button>


      <!-- =================================================
           LOADING
           ================================================= -->

      <div
        id="loading"
        class="loading-message"
      >

        Đang tra cứu...

      </div>


      <!-- =================================================
           NOTE
           ================================================= -->

      <div class="input-note">

        Vui lòng nhập đúng 12 số CCCD.

      </div>


      <!-- =================================================
           ERROR
           ================================================= -->

      <div
        id="error"
        class="error-message"
      ></div>


    </section>



    <!-- ===================================================
         RESULT CARD
         =================================================== -->

    <section
      id="resultCard"
      class="result-card"
    >


      <!-- =================================================
           SUCCESS ICON
           ================================================= -->

      <div class="success-icon">

        ✓

      </div>


      <!-- =================================================
           RESULT TITLE
           ================================================= -->

      <div class="result-heading">

        CHÚC MỪNG!

      </div>


      <!-- =================================================
           RESULT SUBTITLE
           ================================================= -->

      <div class="result-subheading">

        Thí sinh đã trúng tuyển.

      </div>



      <!-- =================================================
           HỌ VÀ TÊN
           ================================================= -->

      <div class="student-info-row">

        <div class="student-info-label">

          Họ và tên

        </div>


        <div
          id="studentName"
          class="student-info-value"
        ></div>

      </div>



      <!-- =================================================
           SỐ BÁO DANH
           ================================================= -->

      <div class="student-info-row">

        <div class="student-info-label">

          Số báo danh

        </div>


        <div
          id="studentSBD"
          class="student-info-value"
        ></div>

      </div>



      <!-- =================================================
           NGÀY SINH
           ================================================= -->

      <div class="student-info-row">

        <div class="student-info-label">

          Ngày sinh

        </div>


        <div
          id="studentDOB"
          class="student-info-value"
        ></div>

      </div>



      <!-- =================================================
           NGÀNH TRÚNG TUYỂN
           ================================================= -->

      <div class="student-info-row">

        <div class="student-info-label">

          Ngành trúng tuyển

        </div>


        <div
          id="studentMajor"
          class="student-info-value"
        ></div>

      </div>



      <!-- =================================================
           NGUYỆN VỌNG TRÚNG TUYỂN
           ================================================= -->

      <div class="student-info-row">

        <div class="student-info-label">

          Nguyện vọng trúng tuyển

        </div>


        <div
          id="studentNV"
          class="student-info-value"
        ></div>

      </div>



      <!-- =================================================
           TRẠNG THÁI
           ================================================= -->

      <div class="student-info-row">

        <div class="student-info-label">

          Trạng thái

        </div>


        <div>

          <span
            id="studentStatus"
            class="student-status"
          ></span>

        </div>

      </div>


    </section>


  </div>



  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script>


    /* =====================================================
       GOOGLE APPS SCRIPT WEB APP URL

       CHỈ THAY URL Ở DÒNG BÊN DƯỚI
       ===================================================== */

    const API_URL =
      "https://script.google.com/macros/s/AKfycby2WIPSceKFSOhsbTgAv5552T6Z7NyY-Eg8dwMr3FfblwmhxWC5GacvorYKPxhQy2s/exec";



    /* =====================================================
       GET ELEMENTS
       ===================================================== */

    const cccdInput =
      document.getElementById("cccd");


    const searchButton =
      document.getElementById("searchBtn");


    const loadingMessage =
      document.getElementById("loading");


    const errorMessage =
      document.getElementById("error");


    const resultCard =
      document.getElementById("resultCard");



    /* =====================================================
       SEARCH STUDENT
       ===================================================== */

    async function searchStudent() {


      /* Lấy CCCD */

      const cccd =
        cccdInput.value.trim();


      /* Reset */

      errorMessage.style.display =
        "none";

      resultCard.style.display =
        "none";


      /* ===================================================
         KIỂM TRA CCCD
         =================================================== */

      if (!/^\d{12}$/.test(cccd)) {

        showError(
          "Vui lòng nhập đúng 12 số CCCD."
        );

        return;

      }


      /* ===================================================
         LOADING
         =================================================== */

      searchButton.disabled =
        true;

      loadingMessage.style.display =
        "block";


      try {


        /* =================================================
           TẠO URL REQUEST
           ================================================= */

        const requestURL =
          API_URL +
          "?cccd=" +
          encodeURIComponent(cccd);


        /* =================================================
           GỌI GOOGLE APPS SCRIPT
           ================================================= */

        const response =
          await fetch(requestURL);


        /* =================================================
           KIỂM TRA RESPONSE
           ================================================= */

        if (!response.ok) {

          throw new Error(
            "Không thể kết nối máy chủ."
          );

        }


        /* =================================================
           ĐỌC JSON
           ================================================= */

        const result =
          await response.json();


        console.log(
          "Kết quả tra cứu:",
          result
        );


        /* =================================================
           KIỂM TRA KẾT QUẢ
           ================================================= */

        if (!result.success) {

          showError(
            result.message ||
            "Không tìm thấy thông tin thí sinh."
          );

          return;

        }


        /* =================================================
           LẤY DỮ LIỆU THÍ SINH
           ================================================= */

        const student =
          result.data;



        /* =================================================
           HỌ VÀ TÊN
           ================================================= */

        document.getElementById(
          "studentName"
        ).textContent =
          student.hoTen || "";



        /* =================================================
           SỐ BÁO DANH
           ================================================= */

        document.getElementById(
          "studentSBD"
        ).textContent =
          student.sbd || "";



        /* =================================================
           NGÀY SINH
           ================================================= */

        document.getElementById(
          "studentDOB"
        ).textContent =
          student.ngaySinh || "";



        /* =================================================
           NGÀNH TRÚNG TUYỂN
           ================================================= */

        document.getElementById(
          "studentMajor"
        ).textContent =
          student.nganh || "";



        /* =================================================
           NGUYỆN VỌNG TRÚNG TUYỂN
           ================================================= */

        document.getElementById(
          "studentNV"
        ).textContent =
          student.nv || "";



        /* =================================================
           TRẠNG THÁI
           ================================================= */

        document.getElementById(
          "studentStatus"
        ).textContent =
          student.trangThai ||
          "TRÚNG TUYỂN";



        /* =================================================
           HIỂN THỊ KẾT QUẢ
           ================================================= */

        resultCard.style.display =
          "block";



        /* =================================================
           CUỘN ĐẾN KẾT QUẢ
           ================================================= */

        setTimeout(
          function () {

            resultCard.scrollIntoView({
              behavior: "smooth",
              block: "start"
            });

          },
          100
        );


      }


      /* ===================================================
         ERROR
         =================================================== */

      catch (error) {

        console.error(
          "Lỗi tra cứu:",
          error
        );


        showError(
          "Có lỗi xảy ra khi tra cứu. Vui lòng thử lại."
        );

      }


      /* ===================================================
         FINALLY
         =================================================== */

      finally {

        searchButton.disabled =
          false;

        loadingMessage.style.display =
          "none";

      }

    }



    /* =====================================================
       SHOW ERROR
       ===================================================== */

    function showError(message) {

      errorMessage.textContent =
        message;

      errorMessage.style.display =
        "block";

    }



    /* =====================================================
       CHỈ CHO PHÉP NHẬP SỐ
       ===================================================== */

    cccdInput.addEventListener(
      "input",
      function () {

        this.value =
          this.value
            .replace(/\D/g, "")
            .slice(0, 12);

      }
    );



    /* =====================================================
       NHẤN ENTER ĐỂ TRA CỨU
       ===================================================== */

    cccdInput.addEventListener(
      "keydown",
      function (event) {

        if (
          event.key === "Enter"
        ) {

          searchStudent();

        }

      }
    );



    /* =====================================================
       CLICK NÚT TRA CỨU
       ===================================================== */

    searchButton.addEventListener(
      "click",
      searchStudent
    );


  </script>


</body>

</html>

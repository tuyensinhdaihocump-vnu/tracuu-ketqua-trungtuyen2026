<!DOCTYPE html>

<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Tra cứu kết quả trúng tuyển 2026
    </title>


    <!-- Google Font -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <main class="page">


        <!-- ======================================
             HEADER
        ======================================= -->

        <section class="header">

            <img
                src="logo.png"
                alt="Logo Trường Đại học Y Dược"
                class="logo"
            >


            <h1>
                TRA CỨU KẾT QUẢ<br>
                TRÚNG TUYỂN
            </h1>


            <p class="subtitle">
                Nhập số CCCD để tra cứu kết quả trúng tuyển.
            </p>

        </section>



        <!-- ======================================
             FORM TRA CỨU
        ======================================= -->

        <section class="lookup-card">

            <form id="lookupForm">


                <label
                    for="cccd"
                    class="form-label"
                >
                    Số CCCD
                </label>


                <input
                    id="cccd"
                    name="cccd"
                    type="text"
                    inputmode="numeric"
                    maxlength="12"
                    autocomplete="off"
                    placeholder="Nhập số CCCD"
                    class="cccd-input"
                >


                <button
                    id="lookupButton"
                    type="submit"
                    class="lookup-button"
                >
                    TRA CỨU KẾT QUẢ
                </button>


                <p class="form-note">
                    Vui lòng nhập đúng 12 số CCCD.
                </p>


            </form>

        </section>



        <!-- ======================================
             MESSAGE
        ======================================= -->

        <div
            id="message"
            class="message"
        ></div>



        <!-- ======================================
             RESULT
        ======================================= -->

        <section
            id="result"
            class="result-container hidden"
        ></section>



        <!-- ======================================
             FOOTER
        ======================================= -->

        <footer>

            Trường Đại học Y Dược – Đại học Quốc gia Hà Nội

        </footer>


    </main>


    <!-- JAVASCRIPT -->

    <script
        src="script.js"
    ></script>


</body>

</html>

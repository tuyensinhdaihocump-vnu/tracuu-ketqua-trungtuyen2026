<!DOCTYPE html>
<html lang="vi">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Tra cứu kết quả trúng tuyển 2026"
  >

  <title>Tra cứu kết quả trúng tuyển 2026</title>


  <!-- CSS -->
  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <div class="page-container">


    <!-- =========================================
         HEADER
         ========================================= -->

    <header class="page-header">


      <img
        class="ump-logo"
        src="https://tuyensinhdaihocump-vnu.github.io/tracuutrangthaihoso2026/logo.png"
        alt="Logo UMP"
        onerror="this.style.display='none'"
      >


      <!--
        Dùng HTML entities cho các chữ có dấu.
        Điều này tránh lỗi glyph/combining mark.
      -->

      <div class="main-heading">

        TRA C&#x1EE8;U K&#x1EBE;T QU&#x1EA2;<br>

        TR&#xDA;NG TUY&#x1EC2;N

      </div>


      <div class="page-subtitle">

        Nh&#x1EAD;p s&#x1ED1; CCCD &#x111;&#x1EC3; tra c&#x1EE9;u k&#x1EBF;t qu&#x1EA3; tr&#xFA;ng tuy&#x1EC3;n.

      </div>


    </header>



    <!-- =========================================
         SEARCH
         ========================================= -->

    <section class="search-card">


      <label
        for="cccd"
        class="cccd-label"
      >

        S&#x1ED1; CCCD

      </label>


      <input
        id="cccd"
        class="cccd-input"
        type="text"
        inputmode="numeric"
        maxlength="12"
        placeholder="Nh&#x1EAD;p 12 s&#x1ED1; CCCD"
        autocomplete="off"
      >


      <button
        id="searchBtn"
        class="search-button"
        type="button"
      >

        TRA C&#x1EEC;U K&#x1EBE;T QU&#x1EA2;

      </button>


      <div
        id="loading"
        class="loading-message"
      >

        &#x110;ang tra c&#x1EE9;u...

      </div>


      <div class="input-note">

        Vui l&#xF2;ng nh&#x1EAD;p &#x111;&#xFA;ng 12 s&#x1ED1; CCCD.

      </div>


      <div
        id="error"
        class="error-message"
      ></div>


    </section>



    <!-- =========================================
         RESULT
         ========================================= -->

    <section
      id="resultCard"
      class="result-card"
    >


      <div class="success-icon">
        ✓
      </div>


      <div class="result-heading">

        CH&#xDA;C M&#x1EEANG!

      </div>


      <div class="result-subheading">

        Th&#xED; sinh &#x111;&#xE3; tr&#xFA;ng tuy&#x1EC3;n.

      </div>



      <div class="student-info-row">

        <div class="student-info-label">

          H&#x1ECD; v&#xE0; t&#xEA;n

        </div>

        <div
          id="studentName"
          class="student-info-value"
        ></div>

      </div>



      <div class="student-info-row">

        <div class="student-info-label">

          S&#x1ED1; b&#xE1;o danh

        </div>

        <div
          id="studentSBD"
          class="student-info-value"
        ></div>

      </div>



      <div class="student-info-row">

        <div class="student-info-label">

          Ng&#xE0;y sinh

        </div>

        <div
          id="studentDOB"
          class="student-info-value"
        ></div>

      </div>



      <div class="student-info-row">

        <div class="student-info-label">

          Ng&#xE0;nh tr&#xFA;ng tuy&#x1EC3;n

        </div>

        <div
          id="studentMajor"
          class="student-info-value"
        ></div>

      </div>



      <div class="student-info-row">

        <div class="student-info-label">

          Nguy&#x1EC7;n v&#x1ECD;ng tr&#xFA;ng tuy&#x1EC3;n

        </div>

        <div
          id="studentNV"
          class="student-info-value"
        ></div>

      </div>



      <div class="student-info-row">

        <div class="student-info-label">

          Tr&#x1EA1;ng th&#xE1;i

        </div>

        <div>

          <span
            id="studentStatus"
            class="student-status"
          ></span>

        </div>

      </div>


    </section>


  </div>



  <!-- =========================================
       JAVASCRIPT
       ========================================= -->

  <script>


    /*
     * =====================================================
     * CHỈ SỬA URL NÀY
     * =====================================================
     */

    const API_URL =
      "https://script.google.com/macros/s/AKfycby2WIPSceKFSOhsbTgAv5552T6Z7NyY-Eg8dwMr3FfblwmhxWC5GacvorYKPxhQy2s/exec";



    const cccdInput =
      document.getElementById("cccd");

    const searchButton =
      document.getElementById("searchBtn");

    const loadingMessage =
      document.getElementById("loading");

    const errorMessage =
      document.getElementById("error");

    const resultCard =
      document.getElementById("resultCard");



    async function searchStudent() {


      const cccd =
        cccdInput.value.trim();


      errorMessage.style.display =
        "none";

      resultCard.style.display =
        "none";


      if (!/^\d{12}$/.test(cccd)) {

        showError(
          "Vui lòng nhập đúng 12 số CCCD."
        );

        return;
      }


      searchButton.disabled =
        true;

      loadingMessage.style.display =
        "block";


      try {


        const requestURL =
          API_URL +
          "?cccd=" +
          encodeURIComponent(cccd);


        const response =
          await fetch(requestURL);


        if (!response.ok) {

          throw new Error(
            "Không thể kết nối máy chủ."
          );

        }


        const result =
          await response.json();


        console.log(
          "Kết quả:",
          result
        );


        if (!result.success) {

          showError(
            result.message ||
            "Không tìm thấy thông tin thí sinh trong DS trúng tuyển."
          );

          return;
        }


        const student =
          result.data;


        document.getElementById(
          "studentName"
        ).textContent =
          student.hoTen || "";


        document.getElementById(
          "studentSBD"
        ).textContent =
          student.sbd || "";


        document.getElementById(
          "studentDOB"
        ).textContent =
          student.ngaySinh || "";


        document.getElementById(
          "studentMajor"
        ).textContent =
          student.nganh || "";


        document.getElementById(
          "studentNV"
        ).textContent =
          student.nv || "";


        document.getElementById(
          "studentStatus"
        ).textContent =
          student.trangThai ||
          "TRÚNG TUYỂN";


        resultCard.style.display =
          "block";


        setTimeout(
          function () {

            resultCard.scrollIntoView({
              behavior: "smooth",
              block: "start"
            });

          },
          100
        );


      }
      catch (error) {

        console.error(
          error
        );

        showError(
          "Có lỗi xảy ra khi tra cứu. Vui lòng thử lại."
        );

      }
      finally {

        searchButton.disabled =
          false;

        loadingMessage.style.display =
          "none";

      }

    }



    function showError(message) {

      errorMessage.textContent =
        message;

      errorMessage.style.display =
        "block";

    }



    cccdInput.addEventListener(
      "input",
      function () {

        this.value =
          this.value
            .replace(/\D/g, "")
            .slice(0, 12);

      }
    );


    cccdInput.addEventListener(
      "keydown",
      function (event) {

        if (
          event.key === "Enter"
        ) {

          searchStudent();

        }

      }
    );


    searchButton.addEventListener(
      "click",
      searchStudent
    );


  </script>


</body>

</html>

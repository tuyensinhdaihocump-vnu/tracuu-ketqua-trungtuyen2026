<!DOCTYPE html>
<html lang="vi">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Tra cứu kết quả trúng tuyển 2026</title>


  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        #f3f6fa;

      color: #1f2937;

      min-height: 100vh;
    }


    .container {

      width: 100%;

      max-width: 760px;

      margin: 0 auto;

      padding: 25px 18px 50px;
    }


    /* =========================
       HEADER
       ========================= */

    .header {

      text-align: center;

      margin-bottom: 24px;
    }


    .logo {

      max-width: 170px;

      max-height: 75px;

      object-fit: contain;

      margin-bottom: 8px;
    }


    .title {

      margin: 0;

      color: #00843d;

      font-size: 28px;

      font-weight: 800;

      line-height: 1.2;

      text-transform: uppercase;
    }


    .subtitle {

      margin-top: 10px;

      color: #718096;

      font-size: 15px;
    }


    /* =========================
       SEARCH BOX
       ========================= */

    .search-card {

      background: white;

      border-radius: 18px;

      padding: 26px;

      box-shadow:
        0 8px 25px rgba(0,0,0,0.06);

      margin-bottom: 20px;
    }


    .label {

      display: block;

      font-size: 15px;

      font-weight: 700;

      margin-bottom: 9px;

      color: #374151;
    }


    .input {

      width: 100%;

      height: 50px;

      padding: 0 15px;

      border: 1px solid #d8dee8;

      border-radius: 12px;

      font-size: 16px;

      outline: none;

      transition: 0.2s;
    }


    .input:focus {

      border-color: #00843d;

      box-shadow:
        0 0 0 3px rgba(0,132,61,0.10);
    }


    .button {

      width: 100%;

      height: 50px;

      margin-top: 14px;

      border: none;

      border-radius: 11px;

      background: #00843d;

      color: white;

      font-size: 15px;

      font-weight: 700;

      cursor: pointer;

      transition: 0.2s;
    }


    .button:hover {

      background: #006f34;
    }


    .button:disabled {

      background: #9bbdaa;

      cursor: not-allowed;
    }


    .note {

      text-align: center;

      margin-top: 11px;

      color: #8a94a6;

      font-size: 13px;
    }


    /* =========================
       RESULT
       ========================= */

    .result-card {

      display: none;

      background: white;

      border-radius: 18px;

      border-top: 4px solid #00843d;

      padding: 28px 24px;

      box-shadow:
        0 8px 25px rgba(0,0,0,0.06);
    }


    .success-icon {

      width: 52px;

      height: 52px;

      margin: 0 auto 10px;

      border-radius: 50%;

      background: #dcfce7;

      color: #00843d;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 30px;

      font-weight: bold;
    }


    .success-title {

      text-align: center;

      color: #00843d;

      font-size: 24px;

      font-weight: 800;

      margin: 0;
    }


    .success-subtitle {

      text-align: center;

      color: #718096;

      font-size: 14px;

      margin-top: 7px;

      margin-bottom: 22px;
    }


    /* =========================
       INFORMATION ROW
       ========================= */

    .info-row {

      display: grid;

      grid-template-columns:
        180px 1fr;

      min-height: 49px;

      border-top: 1px solid #e5e7eb;

      align-items: center;

      gap: 10px;
    }


    .info-label {

      color: #718096;

      font-size: 14px;

      font-weight: 500;
    }


    .info-value {

      color: #111827;

      font-size: 15px;

      font-weight: 700;

      word-break: break-word;
    }


    /* =========================
       STATUS
       ========================= */

    .status {

      display: inline-flex;

      align-items: center;

      padding: 7px 13px;

      border-radius: 20px;

      background: #dcfce7;

      color: #087f3b;

      font-size: 13px;

      font-weight: 700;
    }


    /* =========================
       ERROR
       ========================= */

    .error {

      display: none;

      margin-top: 14px;

      padding: 12px 15px;

      border-radius: 10px;

      background: #fff1f2;

      color: #be123c;

      text-align: center;

      font-size: 14px;
    }


    /* =========================
       LOADING
       ========================= */

    .loading {

      display: none;

      text-align: center;

      margin-top: 12px;

      color: #00843d;

      font-size: 14px;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

      .container {

        padding:
          20px 12px 40px;
      }


      .title {

        font-size: 22px;
      }


      .search-card {

        padding: 20px 16px;
      }


      .result-card {

        padding:
          23px 16px;
      }


      .info-row {

        grid-template-columns:
          135px 1fr;
      }


      .info-label {

        font-size: 13px;
      }


      .info-value {

        font-size: 14px;
      }

    }

  </style>

</head>


<body>


<div class="container">


  <!-- =========================
       HEADER
       ========================= -->

  <div class="header">

    <!-- Nếu có logo thì thay URL bên dưới -->
    <img
      class="logo"
      src="https://tuyensinhdaihocump-vnu.github.io/tracuutrangthaihoso2026/logo.png"
      alt="Logo"
      onerror="this.style.display='none'"
    >


    <h1 class="title">
      TRA CỨU KẾT QUẢ<br>
      TRÚNG TUYỂN
    </h1>


    <div class="subtitle">
      Nhập số CCCD để tra cứu kết quả trúng tuyển.
    </div>

  </div>



  <!-- =========================
       SEARCH
       ========================= -->

  <div class="search-card">

    <label class="label">
      Số CCCD
    </label>


    <input
      id="cccd"
      class="input"
      type="text"
      inputmode="numeric"
      maxlength="12"
      placeholder="Nhập 12 số CCCD"
      autocomplete="off"
    >


    <button
      id="searchBtn"
      class="button"
      onclick="searchStudent()"
    >
      TRA CỨU KẾT QUẢ
    </button>


    <div id="loading" class="loading">
      Đang tra cứu...
    </div>


    <div class="note">
      Vui lòng nhập đúng 12 số CCCD.
    </div>


    <div id="error" class="error"></div>

  </div>



  <!-- =========================
       RESULT
       ========================= -->

  <div
    id="resultCard"
    class="result-card"
  >

    <div class="success-icon">
      ✓
    </div>


    <h2 class="success-title">
      CHÚC MỪNG!
    </h2>


    <div class="success-subtitle">
      Thí sinh đã trúng tuyển.
    </div>



    <!-- HỌ TÊN -->

    <div class="info-row">

      <div class="info-label">
        Họ và tên
      </div>

      <div
        id="studentName"
        class="info-value"
      ></div>

    </div>



    <!-- SỐ BÁO DANH -->

    <div class="info-row">

      <div class="info-label">
        Số báo danh
      </div>

      <div
        id="studentSBD"
        class="info-value"
      ></div>

    </div>



    <!-- NGÀY SINH -->

    <div class="info-row">

      <div class="info-label">
        Ngày sinh
      </div>

      <div
        id="studentDOB"
        class="info-value"
      ></div>

    </div>



    <!-- NGÀNH -->

    <div class="info-row">

      <div class="info-label">
        Ngành trúng tuyển
      </div>

      <div
        id="studentMajor"
        class="info-value"
      ></div>

    </div>



    <!-- NGUYỆN VỌNG -->

    <div class="info-row">

      <div class="info-label">
        Nguyện vọng trúng tuyển
      </div>

      <div
        id="studentNV"
        class="info-value"
      ></div>

    </div>



    <!-- TRẠNG THÁI -->

    <div class="info-row">

      <div class="info-label">
        Trạng thái
      </div>

      <div>

        <span
          id="studentStatus"
          class="status"
        >
        </span>

      </div>

    </div>


  </div>


</div>



<script>


/************************************************
 * URL GOOGLE APPS SCRIPT
 *
 * THAY URL BÊN DƯỚI BẰNG URL WEB APP CỦA BẠN
 ************************************************/

const API_URL =
  "DÁN_URL_WEB_APP_GOOGLE_APPS_SCRIPT_CỦA_BẠN_VÀO_ĐÂY";



/************************************************
 * TRA CỨU
 ************************************************/

async function searchStudent() {


  const input =
    document.getElementById("cccd");

  const button =
    document.getElementById("searchBtn");

  const loading =
    document.getElementById("loading");

  const error =
    document.getElementById("error");

  const result =
    document.getElementById("resultCard");


  const cccd =
    input.value.trim();


  // Ẩn kết quả cũ

  result.style.display = "none";

  error.style.display = "none";


  // Kiểm tra CCCD

  if (!/^\d{12}$/.test(cccd)) {

    showError(
      "Vui lòng nhập đúng 12 số CCCD."
    );

    return;
  }


  // Loading

  button.disabled = true;

  loading.style.display = "block";


  try {


    const url =
      API_URL +
      "?cccd=" +
      encodeURIComponent(cccd);


    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "Không thể kết nối máy chủ."
      );
    }


    const resultData =
      await response.json();


    console.log(
      "Dữ liệu nhận được:",
      resultData
    );


    if (
      !resultData.success
    ) {

      showError(
        resultData.message ||
        "Không tìm thấy thông tin thí sinh."
      );

      return;
    }


    // Dữ liệu thí sinh

    const data =
      resultData.data;


    /**********************************************
     * ĐỔ DỮ LIỆU LÊN GIAO DIỆN
     **********************************************/

    document.getElementById(
      "studentName"
    ).textContent =
      data.hoTen || "";


    // ⭐ SỐ BÁO DANH

    document.getElementById(
      "studentSBD"
    ).textContent =
      data.sbd || "";


    document.getElementById(
      "studentDOB"
    ).textContent =
      data.ngaySinh || "";


    document.getElementById(
      "studentMajor"
    ).textContent =
      data.nganh || "";


    // ⭐ NGUYỆN VỌNG

    document.getElementById(
      "studentNV"
    ).textContent =
      data.nv || "";


    document.getElementById(
      "studentStatus"
    ).textContent =
      data.trangThai ||
      "TRÚNG TUYỂN";


    // Hiển thị kết quả

    result.style.display =
      "block";


    // Cuộn xuống kết quả

    setTimeout(() => {

      result.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

    }, 100);


  }

  catch (errorObject) {

    console.error(
      errorObject
    );

    showError(
      "Có lỗi xảy ra khi tra cứu. Vui lòng thử lại."
    );

  }

  finally {

    button.disabled = false;

    loading.style.display = "none";

  }

}



/************************************************
 * HIỂN THỊ LỖI
 ************************************************/

function showError(message) {

  const error =
    document.getElementById("error");

  error.textContent =
    message;

  error.style.display =
    "block";
}



/************************************************
 * CHỈ CHO NHẬP SỐ
 ************************************************/

document
  .getElementById("cccd")
  .addEventListener(
    "input",
    function () {

      this.value =
        this.value
          .replace(/\D/g, "")
          .slice(0, 12);

    }
  );



/************************************************
 * ENTER ĐỂ TRA CỨU
 ************************************************/

document
  .getElementById("cccd")
  .addEventListener(
    "keydown",
    function (event) {

      if (
        event.key === "Enter"
      ) {

        searchStudent();

      }

    }
  );


</script>


</body>

</html>
